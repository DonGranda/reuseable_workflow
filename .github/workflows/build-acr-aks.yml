name: Build and Push to ACR and Deploy to AKS

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: string

      helm_action:
        description: "Helm action to perform"
        required: false
        type: string
        default: install

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

    outputs:
      image_name:
        description: "Output the name of the image"
        value: ${{ jobs.docker-build-push.outputs.IMAGE_NAME }}

      tag-number:
        description: "Output the version number of the image"
        value: ${{ jobs.docker-build-push.outputs.VERSION_NUMBER }}

permissions:
  id-token: write
  contents: read

jobs:
  docker-build-push:

    name: Build and push Docker image

    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    outputs:
      IMAGE_NAME: ${{ steps.IMG_Name.outputs.IMAGE_NAME }}
      VERSION_NUMBER: ${{ steps.IMG_Name.outputs.tag_number }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Set Image Name and Version Number
        id: IMG_Name
        run: |
          IMAGE_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "tag_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ steps.IMG_Name.outputs.IMAGE_NAME }}:${{ steps.IMG_Name.outputs.tag_number }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ steps.IMG_Name.outputs.IMAGE_NAME }}:${{ steps.IMG_Name.outputs.tag_number }}

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Compute namespace
        id: ns
        run: |
          if [ -n "${{ vars.NAMESPACE }}" ]; then
            echo "namespace=${{ vars.NAMESPACE }}" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=$(echo '${{ inputs.environment }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Helm lint
        run: helm lint ./k8s/helm/go-test

      - name: Helm install or upgrade
        run: |
          helm upgrade --install go-test ./k8s/helm/go-test \
            --namespace ${{ steps.ns.outputs.namespace }} \
            --create-namespace \
            --set image.repository=${{ vars.ACR_LOGIN_SERVER }}/${{ steps.IMG_Name.outputs.IMAGE_NAME }} \
            --set image.tag=${{ steps.IMG_Name.outputs.tag_number }} \
            --wait \
            --timeout 5m
