name: Reusable Docker Build and Push To ACR

on:
  workflow_call:
    inputs:
      acr-name:
        description: "Azure Container Registry name (without .azurecr.io)"
        required: true
        type: string
      acr-login-server:
        description: "Full ACR login server, e.g. myacr.azurecr.io"
        required: true
        type: string
      image-name:
        description: "Docker image name"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    name: Build and push Docker image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Azure Login
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ inputs.acr-name }}

      - name: Build Docker image
        run: docker build -t ${{ inputs.acr-login-server }}/${{ inputs.image-name }}:${{ github.run_number }} .

      - name: Push Docker image
        run: docker push ${{ inputs.acr-login-server }}/${{ inputs.image-name }}:${{ github.run_number }}
